services:
  backend:
    build: ./backend
    environment:
      - PYTHONUNBUFFERED=1
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    networks:
      - default
      - proxy

  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE=
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - proxy

networks:
  default:
  proxy:
    name: ${PROXY_NETWORK_NAME:-proxy}
    external: true
